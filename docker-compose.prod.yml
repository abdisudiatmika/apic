# Production overlay for the mini PC deployment. docker-compose.yml on its own
# already has no host port exposure and no mail catcher (see docker-compose.dev.yml
# for where those live for local work) — this file only needs to ADD what
# production needs, never remove/reset anything the base file sets. That's
# deliberate: the Compose `!reset` merge tag needs Compose v2.24+, and this file
# also has to work correctly on whatever version the mini PC has — a version
# mismatch there would silently fail to reset instead of erroring, which is exactly
# how "MySQL not exposed to host" would quietly become false again.
#
# Differences from docker-compose.yml:
#   - nginx exposed ONLY on 127.0.0.1 (loopback), not 0.0.0.0 — reachable from other
#     processes on the same machine (the existing Cloudflare Tunnel connector), never
#     from the LAN or internet directly
#   - restart: always instead of unless-stopped (a mini PC should come back up on
#     its own after a power loss with no human involved)
#   - docker/php/php.prod.ini overlaid on top of the image's baked-in php.ini
#   - docker/nginx/default.prod.conf (adds HSTS) instead of default.conf
#
# No dedicated cloudflared service here — the mini PC already runs a Cloudflare
# Tunnel connector (for other apps on the same box, e.g. "server-abdi"). Reusing it
# means one more Public Hostname route, not a second tunnel process:
#   1. Pick a free host port for HRIS (default below: 8081 — change HRIS_PORT in
#      .env if that collides with something else already running).
#   2. Cloudflare Zero Trust dashboard → the existing tunnel → Public Hostname →
#      Add a hostname (e.g. hris.yourdomain.com) → Service type HTTP →
#      URL "localhost:8081" (or whatever HRIS_PORT you picked).
#      This only works if the existing cloudflared connector shares the host's
#      network — true for a systemd/native install, and for a Docker container run
#      with `--network host`. If your connector instead runs in its own Docker
#      bridge network, point the route at "host.docker.internal:8081" instead (only
#      works if that connector container was started with
#      --add-host=host.docker.internal:host-gateway, or you're on Docker Desktop).
#      Run `systemctl status cloudflared` or `docker ps` / `docker inspect
#      <container> --format '{{.HostConfig.NetworkMode}}'` on the mini PC first if
#      you're not sure which case applies.
#   3. No token, no new tunnel, no cloudflared service in this file — the existing
#      connector already handles TLS termination and forwarding.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (merges with the base file for the app/queue/scheduler/mysql/redis service
# definitions — this file only overrides what production needs to differ.)
#
# Not yet exercised end-to-end: doing so needs the real tunnel route added on the
# mini PC, which doesn't exist in local dev. Validated so far with `docker compose
# -f docker-compose.yml -f docker-compose.prod.yml config` (syntax/merge check only).

services:
  app:
    restart: always
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro

  queue:
    restart: always
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro

  scheduler:
    restart: always
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro

  nginx:
    restart: always
    ports:
      - "127.0.0.1:${HRIS_PORT:-8081}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    restart: always

  redis:
    restart: always
