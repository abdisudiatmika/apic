# Production overlay for the mini PC deployment. Differences from docker-compose.yml:
#   - no mailpit (use a real SMTP provider via src/.env)
#   - mysql not exposed to the host at all (dev exposes 127.0.0.1:3307 for a local
#     DB client; prod has no legitimate reason to reach it from outside the network)
#   - nginx not exposed to the host either — caddy is the only public entrypoint,
#     terminating HTTPS and reverse-proxying to nginx over the internal network
#   - restart: always instead of unless-stopped (a mini PC should come back up on
#     its own after a power loss with no human involved)
#   - docker/php/php.prod.ini overlaid on top of the image's baked-in php.ini
#   - docker/nginx/default.prod.conf (adds HSTS) instead of default.conf
#
# Usage once a domain points at the mini PC's public IP:
#   APP_DOMAIN=hris.example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (merges with the base file for the app/queue/scheduler/mysql/redis service
# definitions — this file only overrides what production needs to differ.)
#
# Not yet exercised end-to-end: doing so needs a real domain and public DNS, which
# don't exist in local dev. Validated so far with `docker compose -f
# docker-compose.yml -f docker-compose.prod.yml config` (syntax/merge check only).

services:
  app:
    restart: always
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro

  queue:
    restart: always
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro

  scheduler:
    restart: always
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro

  nginx:
    restart: always
    ports: !reset []
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    restart: always
    ports: !reset []

  redis:
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: hris_caddy
    restart: always
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN to the public hostname before deploying}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - hris_caddy_data:/data
      - hris_caddy_config:/config
    depends_on:
      - nginx
    networks: [hris]

volumes:
  hris_caddy_data:
  hris_caddy_config:
