server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 15M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # See docker/nginx/default.conf for why script-src needs both 'unsafe-inline'
    # and 'unsafe-eval' (Alpine.js directive evaluation via new Function()).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Only meaningful here, not in default.conf: this container is never reached
    # directly in production (docker-compose.prod.yml keeps it off the host network
    # entirely — Caddy is the only public entrypoint and terminates HTTPS). Sending
    # HSTS over the plain-HTTP dev server would just be a header browsers ignore,
    # which is confusing to see in dev tools — hence it's kept out of default.conf.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(\.env|composer\.(json|lock)|artisan)$ {
        deny all;
    }

    location ~ ^/storage/(logs|framework)/ {
        deny all;
    }
}
