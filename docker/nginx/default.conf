server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Reasonable ceiling for attendance Excel uploads (5.3.1) without leaving it unbounded.
    client_max_body_size 15M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP is intentionally left off here: Filament's inline styles/scripts need it
    # tuned carefully. Add it during the hardening phase once the UI is final,
    # instead of shipping a broken or falsely-reassuring policy now.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Block everything except the ACME well-known path (not needed locally, kept for parity).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Never serve env files, composer metadata, or logs even if someone guesses the path.
    location ~ ^/(\.env|composer\.(json|lock)|artisan)$ {
        deny all;
    }

    location ~ ^/storage/(logs|framework)/ {
        deny all;
    }
}
