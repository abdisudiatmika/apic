; Hardened defaults for the app/queue/scheduler containers.
; Production-only tightening (e.g. opcache.validate_timestamps=0) belongs in a
; separate docker/php/php.prod.ini added during the deployment/hardening phase.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Sized for attendance Excel imports (5.3.1) plus lampiran uploads (cuti, surat tugas).
upload_max_filesize = 15M
post_max_size = 20M
max_execution_time = 60
max_input_time = 60
memory_limit = 256M

session.cookie_httponly = 1
session.use_strict_mode = 1
; Flip to 1 once the app is served over HTTPS (mini PC deployment phase).
session.cookie_secure = 0

; Never keep an interactive debugger/profiler enabled in an image that could get shipped as-is.
xdebug.mode = off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
