; Production overlay — mounted over the same path as docker/php/php.ini
; (/usr/local/etc/php/conf.d/99-custom.ini) by docker-compose.prod.yml, replacing it
; rather than being merged with it. Kept as a full copy with the prod-specific lines
; changed, so this file is self-contained and diffable against php.ini.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

upload_max_filesize = 15M
post_max_size = 20M
max_execution_time = 60
max_input_time = 60
memory_limit = 256M

session.cookie_httponly = 1
session.use_strict_mode = 1
; Caddy terminates HTTPS in front of this stack (docker-compose.prod.yml), so the
; browser only ever sees this app over TLS — safe to require the secure flag.
session.cookie_secure = 1

xdebug.mode = off

opcache.enable = 1
opcache.memory_consumption = 128
; Dev reloads code every request (revalidate_freq=2) so edits show up without a
; container restart. Prod never edits code in place — deploys rebuild/restart the
; container — so timestamps are never checked, which skips a filesystem stat per
; include and is the standard opcache production setting.
opcache.validate_timestamps = 0
