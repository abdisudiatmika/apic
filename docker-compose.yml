services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: hris-apic/app:local
    container_name: hris_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    env_file:
      - ./src/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [hris]

  queue:
    image: hris-apic/app:local
    container_name: hris_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    env_file:
      - ./src/.env
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      - app
    networks: [hris]

  scheduler:
    image: hris-apic/app:local
    container_name: hris_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    env_file:
      - ./src/.env
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      - app
    networks: [hris]

  nginx:
    image: nginx:alpine
    container_name: hris_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [hris]

  mysql:
    image: mysql:8.0
    container_name: hris_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hris_apic}
      MYSQL_USER: ${DB_USERNAME:-hris_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    ports:
      # Host port 3307, not 3306: this Mac already runs a native Homebrew MySQL
      # on 3306. Containers still talk to each other over "mysql:3306" internally —
      # this only affects connecting a local DB client from the host.
      - "127.0.0.1:3307:3306"
    volumes:
      - hris_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [hris]

  redis:
    image: redis:7-alpine
    container_name: hris_redis
    restart: unless-stopped
    networks: [hris]

  mailpit:
    image: axllent/mailpit
    container_name: hris_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [hris]

networks:
  hris:
    driver: bridge

volumes:
  hris_mysql_data:
